[project]
name = "csv-data-analyst"
version = "0.1.0"
description = "Agent analyste de données conversationnel sur CSV depuis Google Drive (Mistral Agents SDK)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.2,<1.2",
    "pandas>=3.1.1",
]

[tool.mistralai.agents]
entrypoint = "main:agent"
